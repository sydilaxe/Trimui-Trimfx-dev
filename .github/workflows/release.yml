name: release

# Push a tag like v0.2.0 (or v0.2.0-beta1 for a pre-release) and this builds the MustardOS package
# with that version compiled in, runs the tests, and publishes a GitHub release with the package.
# Or run it by hand (Actions > release > Run workflow) and give the tag: it is made from the
# branch chosen there.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. v0.2.0 (made from the chosen branch if it does not exist)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  test:
    name: Engine tests (ASan/UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - run: make test

  release:
    name: Build and publish
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the tag
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::'$TAG' is not a version tag like v0.2.0 or v0.2.0-beta1"; exit 1
          fi
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          case "$TAG" in *-*) echo "PRERELEASE=--prerelease" >> "$GITHUB_ENV" ;; *) echo "PRERELEASE=--latest" >> "$GITHUB_ENV" ;; esac
      - name: Build the package
        run: |
          pip install ziglang==0.14.1
          for s in Apps/TrimFX/launch.sh mustardos/*.sh; do sh -n "$s"; done
          make -j"$(nproc)" VERSION="$VERSION" package
          b=build/trimui/trimfx
          file $b | grep -q "ARM aarch64"
          readelf -d $b | grep -q "libSDL2-2.0.so.0"
          if objdump -T $b | grep -o "GLIBC_[0-9.]*" | sort -uV | awk -F'[_.]' '$2 > 2 || ($2 == 2 && $3 > 28)' | grep .; then
            echo "::error::the binary needs a glibc newer than 2.28"; exit 1
          fi
          strings $b | grep -qx "$VERSION" || strings $b | grep -q "TrimFX $VERSION" || { echo "::error::the binary does not carry version $VERSION"; exit 1; }
          m=build/TrimFX-mustardos.muxapp
          for f in trimfx launch.sh mux_launch.sh wake_screen.sh glyph/trimfx.svg presets/README.txt LICENSE.txt VERSION; do
            unzip -l $m | grep -q "TrimFX/$f$" || { echo "::error::$m has no $f"; exit 1; }
          done
          [ "$(unzip -p $m TrimFX/VERSION)" = "$VERSION" ] || { echo "::error::the package's VERSION is not $VERSION"; exit 1; }
          if unzip -Z1 $m | grep -Eq '^/|(^|/)\.\.(/|$)|\\'; then echo "::error::$m has unsafe paths"; exit 1; fi
          if unzip -Zl $m | grep -Eq '^[bclps]'; then echo "::error::$m has links or devices"; exit 1; fi
          (cd build && sha256sum TrimFX-mustardos.muxapp > TrimFX-mustardos.muxapp.sha256)
      - name: Release notes
        run: |
          cat > build/notes.md <<NOTES
          **TrimFX $VERSION** for the TrimUI Brick Pro (and Brick, Brick Hammer) on MustardOS.

          **Install:** copy \`TrimFX-mustardos.muxapp\` into \`ARCHIVE/\` on the MustardOS card and install it
          from the Archive Manager. Your presets, \`state.txt\` and \`midimap.txt\` are kept when you install
          over an older version.

          Built from ${GITHUB_SHA::7}. Not every change is tested on Brick hardware: \`TFX_LOG=2\` in
          \`launch.sh\` logs the audio load and dropouts to \`log.txt\`.
          NOTES
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            # a re-run: replace the files, keep the release
            gh release upload "$TAG" build/TrimFX-mustardos.muxapp build/TrimFX-mustardos.muxapp.sha256 --clobber
          else
            gh release create "$TAG" build/TrimFX-mustardos.muxapp build/TrimFX-mustardos.muxapp.sha256 \
              --target "$GITHUB_SHA" --title "TrimFX $VERSION" --notes-file build/notes.md --generate-notes $PRERELEASE
          fi
